<?xml version="1.0" encoding="UTF-8"?>
<!-- Merge this system into the configuration your firmware actually reads.
     /sdcard is an EXAMPLE mount path. Do not replace all your existing systems. -->
<systemList>
  <system>
    <name>fake-mobile-games</name>
    <fullname>Fake Mobile Games</fullname>
    <path>/sdcard/fake-mobile-games/games</path>
    <extension>.fmg</extension>
    <command>/bin/sh "/sdcard/fake-mobile-games/launch.sh" "%ROM%"</command>
    <platform>ignore</platform>
    <theme>fake-mobile-games</theme>
  </system>
</systemList>
